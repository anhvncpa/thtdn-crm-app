<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THTDN CRM – đã chuyển sang app mới</title>
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b6e4f;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px}
  a.b{background:#f05a22;color:#fff;text-decoration:none;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:600}
  p{max-width:360px;font-size:14px;opacity:.9;line-height:1.5;margin:0}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <div style="font-weight:700;font-size:19px">THTDN CRM đã chuyển sang app mới</div>
  <p>Đang mở app mới… Nếu không tự mở, bấm nút dưới.</p>
  <a class="b" id="go" href="https://thtdn-crm-dev.thtdn.workers.dev/">Mở app mới</a>
  <p style="font-size:13px;opacity:.8">Nên cài app mới (biểu tượng xanh lá): Chrome / Edge → ⋮ → Cài đặt ứng dụng; iPhone (Safari) → Chia sẻ → Thêm vào MH chính. Sau đó có thể gỡ biểu tượng cũ.</p>
</main>
<script>
  // Vỏ cũ (GitHub Pages) → app mới trên Cloudflare, giữ tham số (vd ?id=… mở thẳng hồ sơ)
  var NEW = 'https://thtdn-crm-dev.thtdn.workers.dev/';
  var u = NEW + (location.search || '');
  document.getElementById('go').href = u;
  setTimeout(function () { location.replace(u); }, 1500);
  // gỡ service worker cũ (vỏ iframe) để lần sau không mở lại bản cũ từ bộ đệm
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
</script>
</body>
</html>
