<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THTDN CRM</title>
<meta name="theme-color" content="#1c2b3a">
<meta name="description" content="THTDN CRM – Hồ sơ & Hợp đồng, Dịch vụ kế toán">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="THT CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html,body{margin:0;height:100%;background:#1c2b3a;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #app{position:fixed;inset:0;top:env(safe-area-inset-top,0);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#f7f8fa;display:block}
  #splash,#off{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#1c2b3a;color:#fff;text-align:center;padding:24px;box-sizing:border-box;transition:opacity .4s}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash .t{font-weight:700;font-size:18px;letter-spacing:.3px}
  #splash .s{font-size:13px;opacity:.7}
  .bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#f05a22;border-radius:4px;animation:mv 1.1s ease-in-out infinite}
  @keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
  #off{display:none;z-index:5}
  #off button{background:#f05a22;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" title="THTDN CRM" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="splash"><img src="icon-192.png" alt=""><div class="t">THTDN CRM</div><div class="bar"><i></i></div><div class="s">Đang mở ứng dụng…</div></div>
<div id="off"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:16px"><div style="font-weight:700;font-size:17px">Không có kết nối mạng</div><div style="font-size:14px;opacity:.8;max-width:320px">App cần Internet để đọc và lưu dữ liệu. Kiểm tra Wi-Fi / 4G rồi bấm Thử lại.</div><button onclick="location.reload()">⟳ Thử lại</button></div>
<script>
  // Địa chỉ web app (Apps Script) – giữ nguyên; truy cập trực tiếp bằng link cũ vẫn dùng bình thường
  var APP = 'https://script.google.com/macros/s/AKfycbwgqWSFzXJuDF714GR9W4Bzi7n9xGxc4WfRkC5iCbUaT_euNnhh06NwVg8LE_JtL2Ic/exec';
  var q = location.search || '';            // chuyển tiếp tham số (vd ?id=… mở thẳng hồ sơ)
  var f = document.getElementById('app'), sp = document.getElementById('splash'), off = document.getElementById('off');
  function hideSplash(){ sp.classList.add('hide'); setTimeout(function(){ sp.style.display='none'; }, 450); }
  if (!navigator.onLine) { off.style.display = 'flex'; sp.style.display = 'none'; }
  else { f.onload = hideSplash; setTimeout(hideSplash, 15000); f.src = APP + q; }
  window.addEventListener('online', function(){ if (off.style.display === 'flex') location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
